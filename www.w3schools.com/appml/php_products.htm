<!DOCTYPE html>
<html lang="en-US">
<head>
<script>/* offline-shim: evita ReferenceError si un JS local no carga (file://, adblock) */
window.uic_prov_pre=window.uic_prov_pre||function(){};
window.uic_prov_al=window.uic_prov_al||function(){};
window.displayInternalFeatures=window.displayInternalFeatures||function(){};
window.MyLearning=window.MyLearning||{loadUser:function(a,b){if(typeof b==="function"){try{b()}catch(e){}}},getUrlFriendlyName:function(u){return (u||"").toLowerCase().replace(/[^a-z0-9]+/g,"-")}};
window.UserSession=window.UserSession||{loggedIn:false};
/* cage-fallback-v2: toda <img> que falle muestra nicocage.png */
(function(){var DONE="data-cage-fallback";function rootPrefix(){var els=document.querySelectorAll("script[src],link[href]");for(var i=0;i<els.length;i++){var u=els[i].getAttribute("src")||els[i].getAttribute("href")||"";var k=u.indexOf("lib/");if(k>=0)return u.slice(0,k);}return "";}var FB=null;function target(){if(FB===null)FB=rootPrefix()+"nicocage.png";return FB;}function fix(g){if(!g||g.tagName!=="IMG"||g.getAttribute(DONE))return;g.setAttribute(DONE,"1");try{g.removeAttribute("srcset");}catch(x){}g.src=target();}function sweep(){var im=document.images;for(var i=0;i<im.length;i++){var g=im[i];if(g.complete&&g.naturalWidth===0)fix(g);}}document.addEventListener("error",function(e){fix(e.target);},true);sweep();document.addEventListener("DOMContentLoaded",sweep);})();</script>
<meta charset="utf-8">
<title>Products</title>
<link rel="stylesheet" href="../w3css/4/w3.css">
<script src="2.0.3/appml.js"></script>
</head>
<body>
<div class="w3-container w3-content">
<h1>Products</h1>

<div id="Form01" class="w3-container w3-light-grey w3-padding-large w3-margin-bottom" style="display:none;" appml-controller="myFormController">
  <div appml-include-html="inc_formcommands.htm"></div>
  <p>
    <label>ProductName:</label>
    <input id="ProductName" class="w3-input w3-border">
  </p>
  <p>
    <label>Supplier:</label>
    <div appml-data="appml.php?model=model_dropdown_suppliers">
      <select id="SupplierID" class="w3-select w3-border">
        <option appml-repeat="records" value="{{SupplierID}}">{{SupplierName}}</option>
      </select>
    </div>
  </p>
  <p>
    <label>Category:</label>
    <div appml-data="appml.php?model=model_dropdown_categories">
      <select id="CategoryID" class="w3-select w3-border">
        <option appml-repeat="records" value="{{CategoryID}}">{{CategoryName}}</option>
      </select>
    </div>
  </p>
  <p>
    <label>Unit:</label>
    <input id="Unit" class="w3-input w3-border">
  </p>
  <p>
    <label>Price:</label>
    <input id="Price" onchange="myValidator(this)" class="w3-input w3-border">
  </p>
</div>

<div appml-data="appml.php?model=model_productslist" appml-controller="myListController">
  <div appml-include-html="inc_listcommands.htm"></div>
  <div appml-include-html="inc_productsquery.htm"></div>
  <table class="w3-table-all">
  <tr>
  <th></th>
  <th>Product Name</th>
  <th>Category</th>
  <th>Supplier</th>
  <th>Price</th>  
  </tr>
  <tr appml-repeat="records">
  <td style="cursor:pointer" onclick="appml('Form01').run({{ProductID}})">&#9998;</td>
  <td>{{ProductName}}</td>
  <td>{{CategoryName}}</td>
  <td>{{SupplierName}}</td>
  <td>{{Price}}</td>  
  </tr>
  </table>
</div>
<h3 id="sumprice"></h3>
</div>

<script>
function myValidator(item) {
    var obj = appml("Form01");
    obj.message = "validate";
    obj.validate = {};
    obj.validate.item = item.id;
    obj.validate.value = item.value;
    myFormController(obj);
}

function myListController($appml) {
    if ($appml.message == "done") {
        var i, x, tot = 0;
        x = $appml.data.records;
        for (i = 0; i < x.length; i++) {
            tot += Number(x[i].Price);
        }
        document.getElementById("sumprice").innerHTML = x.length + " products. Total price: $" + tot.toFixed(2);
    }
    if ($appml.message == "display") {
        if ($appml.display.name == "ProductName") {
            $appml.display.value = $appml.display.value.toUpperCase();
        }
    }
}

function myFormController($appml) {
    if ($appml.message == "ready") {
        $appml.appName = "Form01";
        $appml.dataSource = "appml.php?model=model_productsform";
        return -1;
    }
    if ($appml.message == "loaded") {
        document.getElementById("Form01").style.display = "";
    }
    if ($appml.message == "submit") {
        if (isNaN(document.getElementById("Price").value)) { 
            $appml.setError(15, "Price must be a number");
            return -1;            
        }
    }
    if ($appml.message == "validate") {
        if ($appml.validate.item == "Price") { 
            if (isNaN($appml.validate.value)) { 
                $appml.setError(15, "Price must be a number");
                return;                            
            }
        }
    }
}
</script>

</body>
</html>
