<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="5/w3.css">
<style>
@media screen and (max-width:420px){.w3-sidebar {
  width:150px !important;
}
}
@media screen and (max-width:350px){.w3-sidebar {
  width:100px !important;
}
}

</style>

<body class="w3-white">
<script>/* cage-fallback-v2: toda <img> que falle muestra nicocage.png */
(function(){var DONE="data-cage-fallback";function rootPrefix(){var els=document.querySelectorAll("script[src],link[href]");for(var i=0;i<els.length;i++){var u=els[i].getAttribute("src")||els[i].getAttribute("href")||"";var k=u.indexOf("lib/");if(k>=0)return u.slice(0,k);}return "";}var FB=null;function target(){if(FB===null)FB=rootPrefix()+"nicocage.png";return FB;}function fix(g){if(!g||g.tagName!=="IMG"||g.getAttribute(DONE))return;g.setAttribute(DONE,"1");try{g.removeAttribute("srcset");}catch(x){}g.src=target();}function sweep(){var im=document.images;for(var i=0;i<im.length;i++){var g=im[i];if(g.complete&&g.naturalWidth===0)fix(g);}}document.addEventListener("error",function(e){fix(e.target);},true);sweep();document.addEventListener("DOMContentLoaded",sweep);})();</script>

<div class="w3-sidebar w3-bar-block w3-card w3-animate-left" style="display:none;z-index:2" id="leftMenu">
  <button onclick="closeLeftMenu()" class="w3-bar-item w3-button w3-large">Close &times;</button>
  <a class="w3-bar-item w3-button" href="demo_ifr_sidebar_left_right.htm#">Link 1</a>
  <a class="w3-bar-item w3-button" href="demo_ifr_sidebar_left_right.htm#">Link 2</a>
  <a class="w3-bar-item w3-button" href="demo_ifr_sidebar_left_right.htm#">Link 3</a>
</div>

<div class="w3-sidebar w3-bar-block w3-card w3-animate-right" style="display:none;right:0;z-index:2" id="rightMenu">
  <button onclick="closeRightMenu()" class="w3-bar-item w3-button w3-large">Close &times;</button>
  <a class="w3-bar-item w3-button" href="demo_ifr_sidebar_left_right.htm#">Link 1</a>
  <a class="w3-bar-item w3-button" href="demo_ifr_sidebar_left_right.htm#">Link 2</a>
  <a class="w3-bar-item w3-button" href="demo_ifr_sidebar_left_right.htm#">Link 3</a>
</div>

<div class="w3-teal">
  <button class="w3-button w3-teal w3-xlarge" onclick="openLeftMenu()">&#9776;</button>
  <button class="w3-button w3-teal w3-xlarge w3-right" onclick="openRightMenu()">&#9776;</button>
  <div class="w3-container"> 
    <h2>My Page</h2>
  </div>
</div>

<div class="w3-container">
  <p>Click on the "hamburger" symbol to open the sidebar.</p>
</div>
    
<script>
function openLeftMenu() {
    document.getElementById("leftMenu").style.display = "block";
}
function closeLeftMenu() {
    document.getElementById("leftMenu").style.display = "none";
}

function openRightMenu() {
    document.getElementById("rightMenu").style.display = "block";
}
function closeRightMenu() {
    document.getElementById("rightMenu").style.display = "none";
}
</script>
     
</body>
</html>
